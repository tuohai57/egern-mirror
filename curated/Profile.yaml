  - name: "爱奇艺"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/fmz200/partA/iQIYI.sgmodule
    update_interval: 86400
    enabled: true          # 82% 覆盖，45 条域名 REJECT，0 脚本
  - name: "优酷"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/fmz200/partY/Youku.sgmodule
    update_interval: 86400
    enabled: true          # 100% 覆盖，全库唯一
  - name: "快手"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/fmz200/partK/Kuaishou.sgmodule
    update_interval: 86400
    enabled: true          # 69% 覆盖，9 个独有接口
  - name: "QQ 音乐"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/fmz200/partQ/QQMusic.sgmodule
    update_interval: 86400
    enabled: true          # 91% 覆盖，0 脚本
  - name: "喜马拉雅"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/fmz200/partX/Ximalaya.sgmodule
    update_interval: 86400
    enabled: true          # 60% 覆盖 + loonlab 的 16 个独有接口互补
