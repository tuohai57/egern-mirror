      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/apple-proxy.yaml
      policy: Apple
      update_interval: 86400
  # 苹果通用表 1,569 条。必须排在 apple-cn 和 apple-proxy 之后，
  # 否则它的大范围会把"苹果中国域名直连"和"苹果境外域名走代理"两个专项都吃掉
  - rule_set:
      name: 苹果-通用
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/apple.yaml
      policy: Apple
      update_interval: 86400
  - rule_set:
      name: 代码托管
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/gits.yaml
      policy: 开发
      update_interval: 86400
  # 开发补充包：npm / Docker / GitLab / GitHub 全量 / Dropbox / Cloudflare / Developer
  - rule_set:
      name: 开发补充
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/curated/rules/extra-dev.yaml
      policy: 开发
      update_interval: 86400
  # 外服游戏平台：Steam / Epic / PSN / Xbox / Nintendo / Riot
  - rule_set:
      name: 游戏平台
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/curated/rules/extra-game.yaml
      policy: 游戏
      update_interval: 86400
  # 云服务：AWS / Oracle / Google Drive / iCloud
  - rule_set:
      name: 云服务
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/curated/rules/extra-cloud.yaml
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: PayPal
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/paypal.yaml
      policy: 支付
      update_interval: 86400

  # 剩下这些走兜底（不单独分组，但必须排在 cn-full 前面，
  # 否则会被国内大表误判成直连）
  - rule_set:
      name: 加密货币
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/crypto.yaml
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: 论坛
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/forum.yaml
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: 海外电商
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/ecommerce.yaml
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: DMCA 站点
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/dmca.yaml
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: Talkatone
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/talkatone.yaml
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: 顶级域代理
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/tld-proxy.yaml
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: 定位服务-代理
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/iplocation-proxy.yaml
      policy: 兜底
      update_interval: 86400
  # 成人站点：必须走代理（国内 DNS 污染 + 部分地区封锁），v9.9 有这两个分类
  - rule_set:
      name: 成人-Hanime1
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/deezertidal-shadowrocket-rules-hanime1.list
      policy: 兜底
      update_interval: 86400
  - rule_set:
      name: 成人-Javdb
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/deezertidal-shadowrocket-rules-javdb.list
      policy: 兜底
      update_interval: 86400

  # ── 第 4 层：直连类专项 ────────────────────────────────────────────────
  # 定位服务-直连：Apple 定位相关域名必须直连，否则定位会飘
  - rule_set:
      name: 定位服务-直连
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/iplocation-direct.yaml
      policy: DIRECT
      update_interval: 86400
  # 测速站点直连，否则测出来的是节点速度不是本地速度
  - rule_set:
      name: 测速
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/speedtest.yaml
      policy: DIRECT
      update_interval: 86400
  # CDN 直连：6,795 条。必须排在广告层之后——
  # 实测它与广告表重叠 120 条，放前面会让这 120 个广告 CDN 走直连、广告漏掉
  - rule_set:
      name: CDN 直连
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/cdn.yaml
      policy: DIRECT
      update_interval: 86400

  # ── 第 5 层：国内直连 ──────────────────────────────────────────────────
  # 用 curated 里的合并版：域名 108,073 + IP 段 17,958 在一个文件里。
  # 原方案要挂 cn.yaml + cncidr.yaml 两个文件，只挂前者会让纯 IP 流量掉到代理。
  - rule_set:
      name: 国内直连
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/curated/rules/cn-full.yaml
      policy: DIRECT
      update_interval: 86400
      no_resolve: true

  # ── 第 6 层：代理兜底 ──────────────────────────────────────────────────
  # 35,888 条，占"代理表并集"60.2%。Proxy.lsr 独有 3 条、gfw.yaml 独有 0 条，都不用挂。
  - rule_set:
      name: 代理兜底
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/shunt-rules/loon/Global.lsr
      policy: 兜底
      update_interval: 86400

  # ── 第 7 层：纯 IP 兜底 ────────────────────────────────────────────────
  - geoip:
      name: GeoIP-CN
      match: CN
      policy: DIRECT
      no_resolve: true

  # ── 第 8 层：最终 ──────────────────────────────────────────────────────
  - default:
      name: FINAL
      policy: 兜底


