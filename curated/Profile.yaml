    update_interval: 86400
    enabled: true          # 75% 覆盖，MITM 2 台

  # 以下 fmz200 的模块走"纯域名 REJECT + 0 脚本"路线，断网也不会失效
  - name: "淘宝"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/fmz200/partT/Taobao.sgmodule
    update_interval: 86400
    enabled: true          # 60% 覆盖，33 个独有接口，0 脚本
