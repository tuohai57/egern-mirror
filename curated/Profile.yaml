  # ── 第 1 层：广告 ──────────────────────────────────────────────────────
  # 必须在所有 DIRECT 规则之前。若放到后面，广告域名会先被 DIRECT 掉，永远拦不住。
  #
  # 用 curated 的 ad-full.yaml：5 份广告表全并集（381,808 条），
  # 一个文件覆盖 100%，不用再纠结"挂哪几份、顺序怎么排"。
  # 组成：domain_set 23,937 + domain_suffix_set 356,920 + domain_keyword_set 287 + ip_cidr_set 664
  #
  # 实测依据：这 5 份表互相大量重叠但都不互相包含——
  #   AdvertisingTest 独有 22,057 / adrules 独有 24,808 / AdGuard 独有 28,175
  #   AntiAD 独有 13,610 / AdBlock 独有 12,691
  # 只挂其中任何一份都会漏掉 2-3 万个域名，这就是"还能看到广告"的根源。
  - rule_set:
      name: 广告拦截（总表）
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/curated/rules/ad-full.yaml
      policy: 广告拦截
      update_interval: 86400
      no_resolve: true

  # HTTPDNS 拦截：App 用 HTTPDNS 自己解析域名就能绕过你的规则和 DNS 层拦截，
  # 这 58 条域名必须拦。放在广告层内（43 条与广告表重叠，效果一致）。
  - rule_set:
      name: HTTPDNS 拦截
      match: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/rules/quixoticheart-egern/httpdns.yaml
      policy: 广告拦截
      update_interval: 86400

  # ── 第 2 层：专项直连（必须在第 3 层专项代理 和 cn-full 之前）────────
  # 这几个是"即使被代理规则或国内大表命中，也要直连"的。
  # 实测：bilibili 有 52 条、douyin 有 49 条同时出现在 ChinaMax 里，
  # 所以必须排在大表前面才有意义。
  - rule_set:
