# =============================================================================
# 六、模块（★ 顺序就是优先级，不要随便拖）
# =============================================================================
# 排序原则：按"改写占比"从高到低 —— 改写在上，纯域名拦截在下。
# 原因：纯域名 REJECT 会让请求根本发不出去，把下面模块的改写掐死。
#
# 改写占比实测：墨鱼 99% / 微信 94-95% / 单 App 70-100% / 聚合包 33% /
#               MyBlockAds 21% / HTTPDNS 8-40% / 广告平台拦截器 ~1%
#
# MITM 成本（实测）：聚合包 931 台、墨鱼 437 台、17 个 App 模块合计仅 59 台。
# 也就是说 App 模块几乎不花钱，真正的大头是聚合包和墨鱼。
# =============================================================================

modules:

  # ── 6.1 优先级补丁（必须第一位）──────────────────────────────────────
  # 模块里的 [Rule] 压过本地规则，本地写 DIRECT 救不回来。
  # 这个模块放在最上面，用"上面赢"把被误拦的域名捞回来。
  # 只有 2 条默认生效（七鱼客服 SDK、Apple 系统统计），其余在文件里注释着。
  - name: "0. 优先级补丁"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/curated/modules/00-override.yaml
    update_interval: 86400
    enabled: true

  # ── 6.2 单 App 精细改写（改写占比高，放最上面）────────────────────────
  # 每个模块后面标了：接口覆盖度 / 外链脚本数 / MITM 台数
  - name: "知乎"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-10652bee.lpx
    update_interval: 86400
    enabled: true          # 90% 覆盖，MITM 1 台
  - name: "微博"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-ae197c04.lpx
    update_interval: 86400
    enabled: true          # 75% 覆盖，69 接口，MITM 3 台
  - name: "小红书"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-79651793.lpx
    update_interval: 86400
    enabled: true          # 56% 覆盖，MITM 10 台，3 个外链 JS
  - name: "哔哩哔哩"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-98bc0fa0.lpx
    update_interval: 86400
    enabled: true          # 83% 覆盖，MITM 6 台，4 个外链 JS
  - name: "腾讯视频"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-4d0e6c12.lpx
    update_interval: 86400
    enabled: true          # 71% 覆盖，MITM 0 台
  - name: "百度网盘"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-5a48a2c4.lpx
    update_interval: 86400
    enabled: true          # 100% 覆盖，MITM 2 台
  - name: "闲鱼"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-25d617c6.lpx
    update_interval: 86400
    enabled: true          # 88% 覆盖，MITM 2 台
  - name: "高德地图"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-2b9a2951.lpx
    update_interval: 86400
    enabled: true          # 64% 覆盖，MITM 1 台
  - name: "网易云音乐"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-3339cf75.lpx
    update_interval: 86400
    enabled: true          # 69% 覆盖，MITM 2 台
  - name: "拼多多"
    url: https://cdn.jsdelivr.net/gh/tuohai57/egern-mirror@main/modules/loonlab/loonlab-plugin-78e0d6e2.lpx
    update_interval: 86400
    enabled: true          # 74% 覆盖，MITM 3 台
  - name: "酷安"
